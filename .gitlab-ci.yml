# Protected development checks and publication of release snapshots.
stages: [checks, publish]

default:
  image: ghcr.io/cirruslabs/android-sdk:36@sha256:f9b3ea9ed2b5fc9522adae82c7b4622ab7aa54207ef532c8e615a347dca08f31
  tags: [meshcentral-android]
  interruptible: false

variables:
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PYTHONDONTWRITEBYTECODE: "1"
  GITHUB_REPOSITORY: "papajon123/meshcentral-android"
  GRADLE_CACHE_KEY: "android-36-gradle-124"

workflow:
  rules:
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    # Review branches behind merge requests: checks only, never publication, and a Gradle cache
    # separate from the one main and release tags restore.
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_BRANCH =~ /^mr\// && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        GRADLE_CACHE_KEY: "review-android-36-gradle-124"
    - when: never

checks:
  stage: checks
  timeout: 30m
  cache:
    key: "$GRADLE_CACHE_KEY"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
      - .android-sdk-cache/build-tools/
  script:
    # SDK 36 is in the pinned image. Retain the project's Build Tools 35.0.0 and cache them.
    - |
      mkdir -p "$ANDROID_HOME/build-tools" .android-sdk-cache/build-tools
      if [ -d .android-sdk-cache/build-tools/35.0.0 ]; then
        cp -a .android-sdk-cache/build-tools/35.0.0 "$ANDROID_HOME/build-tools/"
      fi
      if [ ! -f "$ANDROID_HOME/build-tools/35.0.0/source.properties" ]; then
        sdkmanager 'build-tools;35.0.0'
      fi
      cp -a "$ANDROID_HOME/build-tools/35.0.0" .android-sdk-cache/build-tools/
    - python3 ci/check_translations.py
    - python3 -B -m unittest discover -s ci -p 'test_*.py'
    - bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug compileDebugAndroidTestKotlin
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        python3 ci/publish_github_snapshot.py --source "$CI_PROJECT_DIR" --tag "$CI_COMMIT_TAG" --check-only
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/
      - app/build/test-results/

publish_github_snapshot:
  stage: publish
  needs:
    - job: checks
      artifacts: false
  timeout: 10m
  resource_group: github-release-snapshots
  environment:
    name: github-release
  rules:
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - command -v python3 git ssh ssh-agent ssh-add
    - python3 ci/publish_github_snapshot.py --source "$CI_PROJECT_DIR" --tag "$CI_COMMIT_TAG" --publish
