# Protected development checks and publication of release snapshots.
stages: [checks, publish]

default:
  image: ghcr.io/cirruslabs/android-sdk:35@sha256:54e4ef10f19c211052851736dfb783ee26935a089b06bb1f9019a311cdc38af0
  tags: [meshcentral-android]
  interruptible: false

variables:
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  PYTHONDONTWRITEBYTECODE: "1"
  GITHUB_REPOSITORY: "papajon123/meshcentral-android"

workflow:
  rules:
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

checks:
  stage: checks
  timeout: 30m
  script:
    - python3 ci/check_translations.py
    - python3 -B -m unittest discover -s ci -p 'test_*.py'
    - bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        python3 ci/publish_github_snapshot.py --source "$CI_PROJECT_DIR" --tag "$CI_COMMIT_TAG" --check-only
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/
      - app/build/test-results/

publish_github_snapshot:
  stage: publish
  needs:
    - job: checks
      artifacts: false
  timeout: 10m
  resource_group: github-release-snapshots
  environment:
    name: github-release
  rules:
    - if: '$CI_PROJECT_ID == "124" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  script:
    - command -v python3 git ssh ssh-agent ssh-add
    - python3 ci/publish_github_snapshot.py --source "$CI_PROJECT_DIR" --tag "$CI_COMMIT_TAG" --publish
