name: Export encrypted Google Play signing key
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: play-signing-transfer
  cancel-in-progress: false
jobs:
  export:
    if: github.repository == 'papajon123/meshcentral-android' && github.ref == 'refs/tags/v0.10.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify the pinned public encryption tool
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 ci/download_pepk.py
      - name: Verify transfer using throwaway keys
        env:
          PEPK_TEST_JAR: .tools/pepk.jar
        run: python3 -m unittest discover -s ci -p 'test_play_signing_transfer.py' -v
      - name: Encrypt the existing public signing identity for Google
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: bash ci/export-play-signing.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-signing-transfer
          path: |
            dist/play-signing-transfer.p7m
            dist/play-signing-transfer.json
          if-no-files-found: error
          retention-days: 1
