name: Android checks
# GitHub `main` only receives release snapshots: the GitLab bridge pushes `main` and the release tag
# atomically, and release.yml runs these checks for that exact commit. A separate push trigger would
# test the same tree twice and make both runs compete for emulator runners.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Build, unit tests and lint
        run: |
          python3 ci/check_translations.py
          python3 ci/prepare_play_assets.py
          python3 -m unittest discover -s ci -p 'test_*.py'
          # Free lint/UAST memory before APK/AAB packaging on bounded CI hosts.
          ./gradlew --no-daemon --max-workers=2 --stacktrace testDirectDebugUnitTest testPlayDebugUnitTest lintDirectDebug lintPlayDebug
          ./gradlew --no-daemon --max-workers=2 --stacktrace assembleDirectDebug assemblePlayDebug bundlePlayRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
  device-tests:
    name: device-tests (${{ matrix.api }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    # The full suite has about 800 cases; one unsharded API run took 27-31 minutes, and long runs
    # occasionally lost the emulator. Two disjoint AndroidJUnitRunner shards per API take ~15 minutes.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk space for Android virtual devices
        shell: bash
        run: |
          # Only disposable GitHub-hosted Linux VMs: these toolchains are unused by this project.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h /home/runner
          for toolchain in /usr/share/dotnet /usr/local/.ghcup; do
            if [ -d "$toolchain" ]; then
              sudo du -sh "$toolchain"
              sudo rm -rf -- "$toolchain"
            fi
          done
          df -h /home/runner
      - uses: ./.github/actions/android-setup
      - name: Check available emulator storage
        shell: bash
        run: |
          available=$(df -Pk /home/runner | awk 'NR==2 {print $4}')
          test "$available" -ge 12582912 || { echo 'At least 12 GiB free is required for the emulator and build'; exit 1; }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          # Exercise system key events and software IME in the same deterministic device profile.
          # run-device-tests.sh explicitly enables the software IME alongside this keyboard.
          enable-hw-keyboard: true
          disable-animations: true
          script: NUM_SHARDS=2 SHARD_INDEX=$(( ${{ matrix.shard }} - 1 )) bash ci/run-device-tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-reports-api-${{ matrix.api }}-shard-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/webview/
            app/build/outputs/androidTest-results/
          retention-days: 14
