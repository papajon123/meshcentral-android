services:
  server:
    image: meshpilot-review-server:local
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    platform: linux/amd64
    hostname: server
    environment:
      MESHPILOT_DATA_DIR: /data
      MESHPILOT_AGENT_CONFIG_DIR: /agent-config
      MESHPILOT_MESHCENTRAL_HOME: /opt/meshcentral/node_modules/meshcentral
      MESH_DEMO_ADMIN_PASSWORD: "${MESH_DEMO_ADMIN_PASSWORD:?MESH_DEMO_ADMIN_PASSWORD must be set}"
      MESH_DEMO_REVIEW_PASSWORD: "${MESH_DEMO_REVIEW_PASSWORD:?MESH_DEMO_REVIEW_PASSWORD must be set}"
    ports:
      - "127.0.0.1:4469:8443"
    volumes:
      - meshcentral-data:/data
      - agent-config:/agent-config
    networks:
      - edge
      - link
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const https = require('https');
          const req = https.get({ host: '127.0.0.1', port: 8443, path: '/', rejectUnauthorized: false, timeout: 4000 }, res => {
            res.resume();
            process.exit(res.statusCode && res.statusCode < 500 ? 0 : 1);
          });
          req.on('timeout', () => { req.destroy(); process.exit(1); });
          req.on('error', () => process.exit(1));
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      # Used only by the root entrypoint to prepare named volumes, then drop to
      # the unprivileged node user with gosu.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    stop_grace_period: 20s
    restart: "no"

  target:
    image: meshpilot-review-target:local
    build:
      context: .
      dockerfile: Dockerfile
      target: target
    platform: linux/amd64
    hostname: target
    environment:
      DISPLAY: ":99"
      MESH_DEMO_SSH_PASSWORD: "${MESH_DEMO_SSH_PASSWORD:?MESH_DEMO_SSH_PASSWORD must be set}"
    expose:
      - "22"
    volumes:
      - agent-config:/run/meshpilot-config:ro
      - sandbox-home:/home/sandbox
      - ssh-host-keys:/run/meshpilot-ssh
    networks:
      - link
    depends_on:
      server:
        condition: service_started
    shm_size: "256m"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.5"
    stop_grace_period: 20s
    restart: "no"

networks:
  # The server has the only externally routed side. The published port is
  # loopback-only; the target has no edge network.
  edge:
    driver: bridge
  link:
    driver: bridge
    internal: true

volumes:
  meshcentral-data:
  agent-config:
  sandbox-home:
  ssh-host-keys:
